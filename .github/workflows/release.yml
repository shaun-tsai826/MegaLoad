# 推送 v*.*.* tag 時，建構 Windows x64、macOS aarch64、macOS x86_64 三個版本，
# 全部成功後才建立 GitHub Draft Release（需求 8）。
#
# 流程：test → build（matrix）→ release
# - build 只打包並上傳 artifact；任一目標失敗時 release 不會執行，也就不會留下缺檔的 Draft Release。
# - sidecar 由 scripts/fetch-sidecars.sh 依 target triple 下載固定版本（設計調整 #9，不使用 latest）。
#
# 選用的 secrets（macOS 簽章與公證，未設定時產出未簽章的 .dmg）：
#   APPLE_CERTIFICATE、APPLE_CERTIFICATE_PASSWORD、APPLE_SIGNING_IDENTITY、
#   APPLE_ID、APPLE_PASSWORD、APPLE_TEAM_ID
name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: 確認 tag 與 tauri.conf.json 的版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONF_VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          if [[ "$TAG_VERSION" != "$CONF_VERSION" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} 與 tauri.conf.json 的 version ${CONF_VERSION} 不一致"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安裝前端依賴
        run: npm ci

      # tauri-build 會在編譯時檢查 externalBin 是否存在
      - name: 下載 sidecar（本機 triple）
        run: bash scripts/fetch-sidecars.sh

      - name: 前端測試
        run: npm run test:run

      - name: 型別檢查與前端建置
        run: npm run build

      - name: 後端測試
        working-directory: src-tauri
        run: cargo test

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: 安裝前端依賴
        run: npm ci

      # Windows 也用 Git Bash 執行同一支腳本
      - name: 下載 sidecar（${{ matrix.target }}）
        shell: bash
        run: bash scripts/fetch-sidecars.sh ${{ matrix.target }}

      # 只有設定了 secrets 才啟用簽章；未設定時保持環境變數不存在，避免打包時嘗試匯入空憑證
      - name: 設定 Apple 簽章
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "::warning::未設定 APPLE_CERTIFICATE，${{ matrix.target }} 將產出未簽章的 .dmg"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [[ -n "$APPLE_ID" ]]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          fi

      - name: 打包
        run: npm run tauri build -- --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bundle-*
          merge-multiple: true

      - name: 建立 Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "MegaLoad $GITHUB_REF_NAME" \
            --notes "MegaLoad（萬用下載器）$GITHUB_REF_NAME

          - Windows x64：\`.msi\` 或 \`-setup.exe\` 安裝檔
          - macOS Apple Silicon：\`_aarch64.dmg\`
          - macOS Intel：\`_x64.dmg\`"
