[package]
name = "cross-platform-video-downloader"
version = "0.1.5"
edition = "2021"

# Prevent the binary name from being "cross-platform-video-downloader"
[[bin]]
name = "app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
regex = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# 取消下載時對 yt-dlp 送 SIGTERM（PyInstaller 單檔版收到 SIGKILL 會留下孤兒子程序）
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
